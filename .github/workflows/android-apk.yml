name: Build Android APK

# 手动触发即可出包（不需要本地装 Android Studio / JDK）。
# 需要先配好后端地址：仓库 Settings → Secrets and variables → Actions → Variables
# 新增 ZHISHI_SERVER_URL（如 http://1.2.3.4:17777），或手动触发时在 server_url 里填。
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "知拾后端地址（如 http://1.2.3.4:17777）；留空则用仓库变量 ZHISHI_SERVER_URL"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 解析后端地址
        id: cfg
        env:
          INPUT_URL: ${{ github.event.inputs.server_url }}
          VARS_URL: ${{ vars.ZHISHI_SERVER_URL }}
        run: |
          URL="${INPUT_URL:-$VARS_URL}"
          URL="${URL%/}"
          if [ -z "$URL" ]; then
            echo "::error::未配置后端地址。请到 Settings → Secrets and variables → Actions → Variables 添加 ZHISHI_SERVER_URL（如 http://1.2.3.4:17777），或手动触发时填 server_url。"
            exit 1
          fi
          echo "server_url=$URL" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21" # Capacitor 8 需要 JDK 21

      # 不再用 android-actions/setup-android@v3：它按 Node 20 构建、被强制跑在 Node 24 上会失败
      # （run #1 就挂在这一步）。ubuntu-latest 镜像本来就预装 Android SDK，这里只补一次许可接受。
      - name: 确保 Android SDK 许可已接受（runner 已预装 SDK）
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CMDLINE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          echo "ANDROID_SDK=$SDK ; cmdline-tools=$CMDLINE"
          if [ -n "$CMDLINE" ] && [ -x "$CMDLINE/sdkmanager" ]; then
            yes | "$CMDLINE/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$CMDLINE/sdkmanager" --list_installed 2>/dev/null | head -20 || true
          else
            echo "未找到 sdkmanager，跳过（runner 预装 SDK 通常已接受许可）"
          fi

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 构建前端（注入后端地址）
        working-directory: frontend
        env:
          CAP_SERVER_URL: ${{ steps.cfg.outputs.server_url }}
        run: npm run build

      - name: 生成并同步 Android 工程
        working-directory: frontend
        env:
          CAP_SERVER_URL: ${{ steps.cfg.outputs.server_url }}
        run: |
          npx cap add android
          npx cap sync android

      - name: 生成应用图标与启动图
        working-directory: frontend
        run: |
          # 素材：frontend/resources/icon.png（1024，深青满幅 + sage 面板）与 splash.png（2732，纸色 + logo）
          # 不放进 package.json：只有打 APK 用得到，避免把 sharp 拖进应用依赖
          npx --yes @capacitor/assets@3.0.5 generate --android \
            --iconBackgroundColor '#1F5C5A' --iconBackgroundColorDark '#1F5C5A' \
            --splashBackgroundColor '#F3EFE6' --splashBackgroundColorDark '#F3EFE6'

      - name: 允许明文 HTTP（仅当后端是 http:// 时）
        if: startsWith(steps.cfg.outputs.server_url, 'http://')
        working-directory: frontend
        run: node scripts/enable-android-cleartext.mjs android/app/src/main/AndroidManifest.xml

      - name: 固定 debug 签名（否则每次构建密钥都不同，装新版必须先卸载）
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: zhishi-debug-keystore-v1

      - name: 编译 debug APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew   # cap add 复制出的模板在 Linux 上不一定带可执行位
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: zhishi-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
