# 知拾本地配置
# 说明：本机自用单用户，无需鉴权。相对路径均以 backend/ 为基准。
# 也可在设置页修改 MinerU 等项；保存后立即生效。
# 注意：勿把真实 API Token 提交进仓库。

storage_dir: ./storage
image_base_dir: ./storage/images
database_url: sqlite:///./data/zhishi.db
max_concurrency: 1
question_gen_max_concurrency: 3
question_gen_max_pages: 30
mineru_mode: local
mineru_api_token: ""
mineru_api_base: https://mineru.net
mineru_model_version: vlm
